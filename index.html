<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIN WORLD | إمبراطورية الألقاب 👑🖤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="particles" id="particles"></div>
<div class="app">
  <h1>RIN WORLD | <span>إمبراطورية الألقاب 👑🖤</span></h1>
  <p class="sub">ادخل بلقبك المميز، اللقب هيتحجز للأبد ومحدش هياخده تاني 🔥</p>
  <div class="upload" id="uploadBox">
    <img id="preview">
    <div id="txt">📸 حط صورتك الحقيقية<br><small>إجباري - هتظهر في الترحيب</small></div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <input id="nickname" type="text" placeholder="لقبك الأنمي.. مثلا: مادارا" maxlength="15">
  <button id="join" class="btn" disabled>اختار صورة ولقب</button>
  <div class="status" id="status">✅ تم.. جاري دخولك ورين هيرحب بيك حالاً</div>
</div>
<script src="script.js"></script>
</body>
</html>
